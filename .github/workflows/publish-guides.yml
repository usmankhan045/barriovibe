name: Publish scheduled guides

# ── What this does, and why it is a deploy hook rather than a commit ──
#
# Guides carry a `publishedAt` timestamp and content/guides/index.ts filters on
# the build time, so a guide appears when the site is next built at or after its
# slot. Nothing in the repository needs to change for a guide to go live: the
# scheduling is entirely a property of when the build runs.
#
# Vercel builds on push. With no push, it does not rebuild, so a guide scheduled
# for tomorrow would sit unpublished until the next unrelated commit. This
# workflow is the thing that makes the timestamp mean something: at each slot it
# asks Vercel to rebuild, and the filter does the rest.
#
# The alternative, committing an empty change to force a push, was rejected. It
# writes a commit a day into the history for no reason, it races with real work
# on main, and it makes `git log` useless for finding out what actually changed.
#
# ── Why 03:00 and 07:00 UTC ──
#
# 08:00 and 12:00 in Pakistan (UTC+5): two guides a day, four hours apart. The
# first lands before the working day starts and the second around midday.
#
# `publishedAt` is a full timestamp and the gate compares timestamps, so a slot
# only goes live once a build runs after it. That is why there are two crons
# rather than one: a single morning run would publish both of the day's guides
# at once and the four-hour gap would be fiction.
#
# Both runs are well clear of midnight in every timezone the runner might see,
# so there is no ambiguity about which day it thinks it is.

on:
  schedule:
    # 03:00 and 07:00 UTC daily, one per publishing slot. GitHub's scheduler is
    # best-effort and can lag under load; that is acceptable here because the
    # gate is "at or before now" rather than "equals now", so a late or missed
    # run delays a guide to the next build instead of skipping it.
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
  # Manual trigger, for publishing something ahead of schedule or re-running a
  # failed day without waiting twenty-four hours.
  workflow_dispatch:

# Two runs deploying at once would be pointless rather than harmful, but
# serialising them keeps the logs readable.
concurrency:
  group: publish-guides
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── Is anything actually due? ──
      #
      # Asking first means a deploy hook only fires when a guide is genuinely
      # waiting, rather than rebuilding twice a day forever. It also gives the
      # run log a plain statement of what went live, which is the record you
      # want when someone asks why a page appeared.
      #
      # "Due" means scheduled at or before now and not yet published, so this
      # correctly picks up a slot that a missed run left behind.
      - name: Check for guides due now
        id: due
        run: pnpm tsx scripts/guides-due.ts >> "$GITHUB_OUTPUT"

      # ── Verify before deploying ──
      #
      # The full suite, including the tax reconciliation and the no-em-dash
      # check on rendered output. A guide that has sat in the repo for a week
      # is still unverified against today's build until today's build runs, and
      # publishing a broken page automatically is worse than publishing late.
      - name: Verify
        if: steps.due.outputs.due == 'true'
        run: pnpm verify

      - name: Build
        if: steps.due.outputs.due == 'true'
        run: pnpm build

      # ── Ask Vercel to rebuild ──
      #
      # A deploy hook is a URL that triggers a build of a chosen branch. Create
      # one at Vercel > Project > Settings > Git > Deploy Hooks, then store it
      # as the VERCEL_DEPLOY_HOOK repository secret. It is a bearer credential:
      # anyone holding the URL can trigger a build, which is why it is a secret
      # and not an input.
      - name: Trigger Vercel deploy
        if: steps.due.outputs.due == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set. Guides due at this slot will not publish."
            echo "Create a deploy hook in Vercel (Settings > Git > Deploy Hooks)"
            echo "and add it as a repository secret named VERCEL_DEPLOY_HOOK."
            exit 1
          fi
          code=$(curl -sS -o /tmp/hook-response -w '%{http_code}' -X POST "$HOOK")
          echo "Vercel responded $code"
          cat /tmp/hook-response
          # Vercel returns 201 on a queued job. Anything else is a real failure
          # and should fail the run rather than be logged and forgotten.
          case "$code" in
            20*) echo "Deploy queued." ;;
            *) echo "::error::Deploy hook returned $code"; exit 1 ;;
          esac

      # ── Tell the search engines that support being told ──
      #
      # scripts/indexnow.ts has existed and worked for some time, and nothing
      # called it, so every scheduled guide relied on an organic recrawl of the
      # sitemap. That is the doorbell nobody presses.
      #
      # It runs after the deploy hook rather than before, because submitting a
      # URL that is not yet built invites a crawl of a 404. It is also
      # deliberately not allowed to fail the run: a guide that went live but
      # was not announced is a smaller problem than a red workflow, and the
      # sitemap still covers it.
      - name: Ping IndexNow
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        run: pnpm indexnow ${{ steps.due.outputs.paths }}

      - name: Nothing due
        if: steps.due.outputs.due != 'true'
        run: echo "No guide is due at this slot. Vercel was not asked to rebuild."
